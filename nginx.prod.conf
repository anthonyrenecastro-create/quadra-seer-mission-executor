# Production edge proxy: serves the Vite frontend, routes APIs.
# node  -> Node/Express API (port 3001): /api/collab, /api/chat, /api/tts,
#         /api/summarize, /health, /ready
# flask -> Python/Flask Atlantean backend (port 5001): /api/atlantean
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers at the edge (belt and suspenders with helmet on Node).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Cap request bodies at the edge (mirrors express.json 10mb limit).
    client_max_body_size 12m;

    upstream node_api {
        server node:3001;
    }
    upstream flask_api {
        server flask:5001;
    }

    server {
        # 8080: unprivileged port so nginx can run as non-root.
        listen 8080;

        # Frontend static build.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Node/Express API.
        location /api/collab/ {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/chat {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/tts {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/summarize {
            proxy_pass http://node_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health {
            proxy_pass http://node_api;
        }
        location = /ready {
            proxy_pass http://node_api;
        }

        # Python/Flask Atlantean backend.
        location /api/atlantean/ {
            proxy_pass http://flask_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # LLM calls can take a while; allow generous upstream timeouts.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
