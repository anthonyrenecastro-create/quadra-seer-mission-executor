# CI: run on every push and pull request.
# Gates: JS tests, production build, Python tests (torch-dependent tests skip
# gracefully when torch isn't installed), and a Docker build smoke test.
name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        # torch-dependent tests skip (not fail) when torch is unavailable

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t quadra-seer-frontend:ci .
